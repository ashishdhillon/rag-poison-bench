[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-poison-bench"
version = "0.2.0"
description = "Deterministic scanner and reproducible benchmark for indirect prompt injection in RAG pipelines"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Ashish Dhillon", email = "ashishdhillon.dev@gmail.com" }
]
keywords = [
  "rag",
  "prompt-injection",
  "security",
  "indirect-injection",
  "llm-security",
  "benchmark",
  "sanitizer"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0"
]

[project.scripts]
rag-poison-bench = "rag_poison_bench.cli:main"

[project.urls]
Homepage = "https://github.com/ashishdhillon/rag-poison-bench"
Repository = "https://github.com/ashishdhillon/rag-poison-bench"
Issues = "https://github.com/ashishdhillon/rag-poison-bench/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
